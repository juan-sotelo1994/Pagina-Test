<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | {{ empresa.nombre }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/web.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body class="login-page">

    <a href="{{ url_for('web.inicio') }}" class="brand login-brand">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" class="brand-logo" width="40" height="40">
        <span class="brand-text">
            <span class="brand-name">{{ empresa.nombre }}</span>
            <span class="brand-tagline">{{ empresa.lema }}</span>
        </span>
    </a>

    <main class="login-card {% if error %}has-error{% endif %}">

        <!-- Encabezado con el personaje -->
        <div class="login-hero">
            <span class="speed-line" style="--y: 18%; --w: 34%; --x: 58%"></span>
            <span class="speed-line" style="--y: 34%; --w: 22%; --x: 8%"></span>
            <span class="speed-line" style="--y: 52%; --w: 28%; --x: 66%"></span>
            <span class="speed-line" style="--y: 68%; --w: 18%; --x: 12%"></span>

            <svg class="avatar" id="avatar" viewBox="0 0 200 200" aria-hidden="true">
                <g class="notes">
                    <text x="150" y="112" class="note note-1">♫</text>
                    <text x="160" y="140" class="note note-2">♪</text>
                </g>

                <!-- Camisa -->
                <rect x="52" y="150" width="96" height="60" rx="14" class="shirt"/>

                <g class="head" id="avatar-head">
                    <!-- Orejas -->
                    <circle cx="54" cy="104" r="10" class="skin"/>
                    <circle cx="146" cy="104" r="10" class="skin"/>
                    <!-- Cara -->
                    <rect x="56" y="48" width="88" height="112" rx="40" class="skin"/>
                    <!-- Barba -->
                    <path class="beard" d="M57 106 C57 152 74 186 100 186 C126 186 143 152 143 106 C134 121 118 127 100 127 C82 127 66 121 57 106 Z"/>
                    <path class="beard-line" d="M76 140v12M90 150v10M110 150v10M124 140v12"/>
                    <!-- Pelo -->
                    <path class="hair" d="M50 84 C38 46 66 20 100 24 C136 18 166 44 150 86 C146 72 138 64 128 62 C114 70 88 70 74 62 C64 66 56 74 50 84 Z"/>
                    <!-- Cejas -->
                    <path class="brow" d="M70 84 L88 81 M112 81 L130 84"/>

                    <!-- Ojos abiertos -->
                    <g class="eyes-open">
                        <g class="eye-left">
                            <circle cx="80" cy="98" r="5" class="pupil"/>
                        </g>
                        <g class="eye-right">
                            <circle cx="120" cy="98" r="5" class="pupil"/>
                        </g>
                    </g>
                    <!-- Ojos cerrados -->
                    <path class="eyes-closed" d="M72 98 Q80 103 88 98 M112 98 Q120 103 128 98"/>
                    <!-- Ojo izquierdo cerrado + derecho abierto (al mostrar la contraseña) -->
                    <path class="eye-wink" d="M72 98 Q80 103 88 98"/>

                    <!-- Nariz -->
                    <rect x="94" y="98" width="12" height="22" rx="6" class="nose"/>
                    <!-- Boca -->
                    <path class="mouth-smile" d="M90 143 Q100 151 110 143"/>
                    <circle class="mouth-whistle" cx="104" cy="145" r="4.5"/>
                </g>
            </svg>
        </div>

        <!-- Formulario -->
        <form class="login-form" method="post" action="{{ url_for('autenticar.login') }}" novalidate>
            <h1>¡Bienvenido de nuevo!</h1>

            {% if error %}
            <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}

            <label class="field">
                <span class="field-label">Correo electrónico</span>
                <input type="email" name="correo" id="correo" value="{{ correo }}" autocomplete="username" placeholder="tu@empresa.com" required>
            </label>

            <label class="field">
                <span class="field-label">Contraseña</span>
                <span class="field-password">
                    <input type="password" name="contrasena" id="contrasena" autocomplete="current-password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </span>
            </label>

            <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn btn-primary login-submit">
                Ingresar
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </form>
    </main>

    <a href="{{ url_for('web.inicio') }}" class="login-back">← Volver al inicio</a>

    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>

</html>
